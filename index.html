<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Synth Frontend Prototype</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 50px; text-align: center; }
        .controls { background: #2a2a2a; padding: 20px; border-radius: 10px; display: inline-block; }
        .control-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        button { background: #00ff88; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:active { background: #00cc6e; }
    </style>
</head>

<body>


    <h1> WEB SYNTHESIZER PROTOTYPE </h1>

    <div class="controls">
        <button id="playBtn">Play One Shot</button>

        <div class="control-group">
            <label for="oscType">Oscillator Type:</label>
            <select id="oscType">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control-group">
            <label for="freq">Frequency:</label>
            <input type="range" id="freq" min="60" max="1000" value="220">
        </div>
    </div>

    <script>
        
        let audioCtx = null;

        document.getElementById('playBtn').addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Resume audio context if it's suspended 
            if (audioCtx.state == 'suspended'){
                await audioCtx.resume();
            }
            // Create oscillator and gain nodes
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Get selected oscillator type and frequency from UI
            const selectedWave = document.getElementById('oscType').value;
            const selectedFreq = document.getElementById('freq').value;

            osc.type = selectedWave;
            osc.frequency.setValueAtTime(selectedFreq, audioCtx.currentTime);


            // Set initial gain to 0 to prevent clicks (Volume envelope)
            const now = audioCtx.currentTime
            gainNode.gain.setValueAtTime(0, now);

            // Fades audio in over 50ms to prevent clicks
            gainNode.gain.linearRampToValueAtTime(1, now + 0.05);

            // Keep the tone audible for one second, then fade out near the end
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            // Stops the oscillator after 1 second to make the sound last exactly one second
            osc.stop(now + 1);
            
        });
    </script>
</body>
</html>
