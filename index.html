<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Synth Frontend Prototype</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 30px; text-align: center; }
        .synth-container { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .control-group { margin: 15px 0; text-align: left; }
        .section-title { color: #00ff88; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 20px; text-align: left; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        select, input[type="range"] { width: 100%; padding: 8px; border-radius: 6px; border: none; background: #333; color: #fff; }
        .trigger-btn { background: #00ff88; color: #1a1a1a; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s ease; }
        .trigger-btn:hover { background: #00ee7c; }
        .trigger-btn:active { background: #00cc6e; }
    </style>
</head>

<body>


    <h1> WEB SYNTHESIZER PROTOTYPE </h1>

    <div class="synth-container">
        <button id="playBtn" class="trigger-btn">Play One Shot</button>

        <div class="section-title">Oscillator</div>
        <div class="control-group">
            <label for="waveType">Waveform:</label>
            <select id="waveType">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control-group">
            <label for="freq">Base Pitch (Frequency: <span id="freqVal">220</span> Hz)</label>
            <input type="range" id="freq" min="40" max="880" value="220">
        </div>

        <div class="section-title">Unison</div>
        <div class="control-group">
            <label for="voices">Unison Voices (<span id="voicesVal">1</span>)</label>
            <input type="range" id="voices" min="1" max="8" value="1" step="1">
        </div>
        <div class="control-group">
            <label for="unison">Unison Detune (<span id="unisonVal">0</span> cents)</label>
            <input type="range" id="unison" min="0" max="50" value="0" step="1">
        </div>
    </div>

    // AI Copilot Section
    <div class="section-title" style="color: #a200ff; border-bottom-color: #a200ff;">AI Copilot</div>
        <div class="control-group">
            <input type="text" id="aiPrompt" placeholder="e.g., A dark, plucky 80s bass with a long echo..." style="padding: 12px; width: 100%; border-radius: 6px; border: none; background: #333; color: white; font-size: 14px; box-sizing: border-box;">
            <button id="generateBtn" class="trigger-btn" style="background: #a200ff; color: white; margin-top: 10px;">Generate & Play</button>
        </div>

    // Filter and Envelope Section
    <div class="section-title">Filter</div>
        <div class="control-group">
            <label for="cutoff">Cutoff Frequency (<span id="cutoffVal">2000</span> Hz)</label>
            <input type="range" id="cutoff" min="100" max="10000" value="2000">
        </div>

        <div class="section-title">Volume Envelope (ADSR)</div>
        <div class="control-group">
            <label for="attack">Attack Time (<span id="attackVal">0.1</span>s)</label>
            <input type="range" id="attack" min="0" max="2" step="0.05" value="0.1">
        </div>
        <div class="control-group">
            <label for="decay">Decay Time (<span id="decayVal">0.3</span>s)</label>
            <input type="range" id="decay" min="0" max="2" step="0.05" value="0.3">
        </div>
        <div class="control-group">
            <label for="sustain">Sustain Level (<span id="sustainVal">0.6</span>)</label>
            <input type="range" id="sustain" min="0" max="1" step="0.05" value="0.6">
        </div>
        <div class="control-group">
            <label for="release">Release Time (<span id="releaseVal">0.5</span>s)</label>
            <input type="range" id="release" min="0.05" max="3" step="0.05" value="0.5">
        </div>
    </div>

    // Oscilloscope Section
    <div class="section-title" style="color: #00ffcc; border-bottom-color: #00ffcc;">Wavetable Oscilloscope</div>
        <div class="control-group" style="background: #0d0d0d; padding: 10px; border-radius: 8px; border: 1px solid #222;">
            <canvas id="visualizer" width="440" height="180" style="background: #050505; border-radius: 4px; width: 100%; display: block;"></canvas>
        </div>

    <script>
        
        let audioCtx = null;
        let analyser = null;
        let activeNotes = {}; // Track currently playing notes
        let masterGainNode = null;

        // Note to frequency mapping (C4 = 262 Hz)
        const noteFrequencies = {
            'C': 262.00, 'C#': 277.18, 'D': 293.66, 'D#': 311.13, 'E': 329.63, 'F': 349.23,
            'F#': 369.99, 'G': 392.00, 'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
        };

        const freqSlider = (id, valId, suffix = "") => {
            const input = document.getElementById(id);
            const label = document.getElementById(valId);
            input.addEventListener('input', () => {
                label.textContent = input.value + suffix;
            });
        };
        freqSlider('freq', 'freqVal', ' Hz');
        freqSlider('cutoff', 'cutoffVal', ' Hz');
        freqSlider('attack', 'attackVal', 's');
        freqSlider('decay', 'decayVal', 's');
        freqSlider('sustain', 'sustainVal');
        freqSlider('release', 'releaseVal', 's');
        freqSlider('voices', 'voicesVal');
        freqSlider('unison', 'unisonVal', ' cents');

        async function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                masterGainNode = audioCtx.createGain();
                masterGainNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                initVisualizer();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        function playNote(note, duration = null) {
            initAudioContext().then(() => {
                // Stop any existing note with this key first (allows re-triggering)
                if (activeNotes[note]) {
                    stopNote(note);
                }
                
                const now = audioCtx.currentTime;
                const sliderFreq = parseFloat(document.getElementById('freq').value);
                const baseNoteFreq = noteFrequencies[note];
                // Calculate transposition based on the slider (middle C = 262 Hz reference)
                const transpositionRatio = sliderFreq / 262;
                const baseFreq = baseNoteFreq * transpositionRatio;
                const numVoices = parseInt(document.getElementById('voices').value);
                const unisonSpread = parseFloat(document.getElementById('unison').value);
                const waveType = document.getElementById('waveType').value;
                const cutoff = parseFloat(document.getElementById('cutoff').value);
                const attack = parseFloat(document.getElementById('attack').value);
                const decay = parseFloat(document.getElementById('decay').value);
                const sustain = parseFloat(document.getElementById('sustain').value);
                const release = parseFloat(document.getElementById('release').value);

                const voices = [];
                const sustainLevel = Math.max(sustain / numVoices, 0.001);

                // Create multiple voices with unison detune
                for (let v = 0; v < numVoices; v++) {
                    const detune = (v - (numVoices - 1) / 2) * (unisonSpread / (numVoices - 1 || 1));
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc.type = waveType;
                    osc.frequency.setValueAtTime(baseFreq * Math.pow(2, detune / 1200), now);
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(cutoff, now);

                    // ADSR envelope per voice
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(1 / numVoices, now + attack);
                    gain.gain.exponentialRampToValueAtTime(sustainLevel, now + attack + decay);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(masterGainNode);
                    osc.start(now);

                    voices.push({ osc, gain, startTime: now, sustainLevel });
                }

                activeNotes[note] = { voices, duration, startTime: now };
                
                // If duration specified (for one-shot mode), stop after duration
                if (duration) {
                    const totalDuration = attack + decay + (duration || 0.5) + release;
                    const releaseStart = now + attack + decay + (duration || 0.5);
                    
                    voices.forEach(v => {
                        v.gain.gain.setValueAtTime(sustainLevel, releaseStart);
                        v.gain.gain.linearRampToValueAtTime(0.001, releaseStart + release);
                        v.osc.stop(now + totalDuration);
                    });
                    
                    setTimeout(() => delete activeNotes[note], totalDuration * 1000);
                }
            });
        }

        function stopNote(note) {
            if (!activeNotes[note]) return;
            
            const now = audioCtx.currentTime;
            const { voices } = activeNotes[note];
            const release = parseFloat(document.getElementById('release').value);

            voices.forEach(v => {
                try {
                    // Cancel any scheduled changes and ramp down from current level
                    v.gain.gain.cancelScheduledValues(now);
                    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
                    v.gain.gain.linearRampToValueAtTime(0.001, now + release);
                    v.osc.stop(now + release + 0.01);
                } catch (e) {
                    // In case the oscillator is already stopped
                }
            });

            // Remove from active notes after release completes
            setTimeout(() => {
                delete activeNotes[note];
            }, release * 1000 + 50);
        }

        document.getElementById('playBtn').addEventListener('click', async () => {
            await initAudioContext();

            // Play middle C with one-shot duration
            playNote('C', 0.5);
            
        });
        
        
        // AI Integration Logic
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const promptText = document.getElementById('aiPrompt').value;
            const aiBtn = document.getElementById('generateBtn');

            if (!promptText) {
                alert("Please describe a sound first!");
                return;
            }


            aiBtn.innerText = "AI is thinking...";
            aiBtn.disabled = true;

            try {
  
                const response = await fetch('http://127.0.0.1:8000/generate-patch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                
  
                const patch = await response.json();
                console.log("Received AI Patch:", patch);
                document.getElementById('voices').value = patch.oscillator.voices;
                document.getElementById('unison').value = patch.oscillator.unison;
                document.getElementById('waveType').value = patch.oscillator.type;
                document.getElementById('cutoff').value = patch.filter.cutoff;
                document.getElementById('attack').value = patch.envelope.attack;
                document.getElementById('decay').value = patch.envelope.decay;
                document.getElementById('sustain').value = patch.envelope.sustain;
                document.getElementById('release').value = patch.envelope.release;
                

   
                ['cutoff', 'attack', 'decay', 'sustain', 'release', 'voices', 'unison'].forEach(id => {
                    document.getElementById(id).dispatchEvent(new Event('input'));
                });


                document.getElementById('playBtn').click();

            } catch (error) {
                console.error("Error connecting to AI:", error);
                alert("The AI backend is currently offline for the public demo, but you can still play the synthesizer manually!");
            } finally {
                
                aiBtn.innerText = "Generate & Play";
                aiBtn.disabled = false;
            }
        });

        //Waveform Visualizer Logic
        function initVisualizer() {
            if (!analyser) return;
            
            const canvas = document.getElementById('visualizer');
            const canvasCtx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);

                // 1. Draw a dark slate background
                canvasCtx.fillStyle = '#08090c';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. Draw Serum-style background grid lines
                canvasCtx.strokeStyle = '#141923';
                canvasCtx.lineWidth = 1;
                
                // Vertical grid lines
                for (let x = 0; x < canvas.width; x += 40) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(x, 0);
                    canvasCtx.lineTo(x, canvas.height);
                    canvasCtx.stroke();
                }
                // Horizontal grid lines
                for (let y = 0; y < canvas.height; y += 30) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(0, y);
                    canvasCtx.lineTo(canvas.width, y);
                    canvasCtx.stroke();
                }

                // 3. Configure a Glowing Neon Waveform Line (Serum style!)
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = '#00ffcc'; // Neon Cyan/Teal
                canvasCtx.shadowBlur = 8;          // Glow strength
                canvasCtx.shadowColor = '#00ffcc'; // Glow color
                canvasCtx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }
                    x += sliceWidth;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();

                // Reset shadow properties so it doesn't slow down the next frames
                canvasCtx.shadowBlur = 0;
            }

            draw();
        }

    </script>
</body>
</html>
